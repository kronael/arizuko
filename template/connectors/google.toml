# Google Sheets connector over googd's passthrough (spec 6/45). Operator copy:
# drop this block into <data_dir>/connectors.toml (multi-block file) and restart
# routd.
#
# A service-account access token lives an hour and is minted from a signed
# assertion, so no header template can carry one. The connector therefore calls
# googd, which holds the key, and authenticates to googd with its static bearer.
# googd is reached on the compose network, so no TLS and no published route.
# `url` is googd's service address plus `/google`; a multi-account variant is
# `googd-<label>`.
#
# THE BEARER IS TWO COPIES OF ONE VALUE. googd reads GOOGD_CONNECTOR_TOKEN from
# the host .env and refuses every passthrough request while it is unset. routd
# sends it from the `secrets` table, per call, and `readSecrets` passes routd's
# container no such key from the .env:
#
#   arizuko secret <inst> set folder:<folder> GOOGD_CONNECTOR_TOKEN --value <token>
#
# WHAT BOUNDS IT. googd's Sheets token carries `spreadsheets.readonly` only, so
# this tool cannot write a sheet however it is called. Which sheets it reads is
# the service account's sharing: googd knows no folder, so one key serves every
# folder that holds the secret. The `acl` row for `mcp:google_read_sheet_range`
# with `spreadsheet_id=<glob>` is the per-document containment.
#
# NOT HERE. Resolving and reopening a comment thread are a `replies.create` whose
# JSON body carries `action`; a `rest` tool cannot fix a body field, so a tool
# that could only resolve would also reopen or reply.
[[connector]]
name      = "google"
transport = "rest"
url       = "http://googd:8080/google"
secrets   = ["GOOGD_CONNECTOR_TOKEN"]
headers   = { Authorization = "Bearer {secret:GOOGD_CONNECTOR_TOKEN}" }

  [[connector.tool]]
  name        = "read_sheet_range"
  description = "Read a range of a Google Sheet, e.g. range Sheet1!A1:C10 (percent-encode a sheet name that holds a space or quote)."
  scope       = "ext:google:sheets:read"
  method      = "GET"
  path        = "/sheets/v4/spreadsheets/{spreadsheet_id}/values/{range}"
