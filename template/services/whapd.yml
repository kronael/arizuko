# whapd — WhatsApp adapter (Node image). The auth dir persists the paired
# session; deleting it forces a re-pair. WHAPD_STATE_DIR holds the outbound
# dedup ledger — losing it lets routd's re-send of a still-pending row post a
# second WhatsApp message (BUGS L32), the same guarantee discd.yml's mount
# carries for discd.db.
services:
  whapd:
    container_name: ${APP}_whapd_${FLAVOR}
    image: arizuko-whatsapp:latest
    entrypoint: ['node', 'dist/main.js']
    volumes:
      - '${DATA_DIR}/store/whatsapp-auth:/srv/data/store/whatsapp-auth'
      - '${DATA_DIR}/store/whapd:/srv/data/store/whapd'
    env_file: ['../env/whapd.env']
    environment:
      ROUTER_URL: 'http://routd:8080'
      LISTEN_ADDR: ':8080'
      LISTEN_URL: 'http://whapd:8080'
      WHATSAPP_AUTH_DIR: '/srv/data/store/whatsapp-auth'
      WHAPD_STATE_DIR: '/srv/data/store/whapd'
    depends_on: [routd]
    restart: on-failure
