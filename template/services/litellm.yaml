# What the gateway needs from the instance .env, provisioned by `packages add`
# and again by every generate (spec 5/8 `env`). The virtual key has no meaning
# a human could supply, so it is minted once and lands in .env as the
# operator's line; the URL is what runed hands every spawn and is the compose
# service name, so it holds unless the operator points at another gateway.
# The model credential itself (ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN)
# is the instance's own need, not this package's, and is not declared here.
env:
  MODEL_GATEWAY_KEY:
    generate: true
  MODEL_GATEWAY_URL:
    default: 'http://litellm:4000'
