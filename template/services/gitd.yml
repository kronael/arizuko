# gitd — GitHub webhook ingress (spec 6/27). Delivery sources and their sealed
# secrets are routd's (`arizuko github <inst> add …`) and gitd's own
# inbound-retention and outbound-dedup record is its own prefix; both live on the
# store server, so gitd mounts no part of the data dir.
# SECRETS_KEY + the optional GITHUB_TOKEN arrive via env/gitd.env.
services:
  gitd:
    container_name: ${APP}_gitd_${FLAVOR}
    image: arizuko:latest
    entrypoint: ['gitd']
    env_file: ['../env/gitd.env']
    environment:
      ROUTER_URL: 'http://routd:8080'
      LISTEN_ADDR: ':8080'
      LISTEN_URL: 'http://gitd:8080'
    depends_on: [routd]
    restart: on-failure
