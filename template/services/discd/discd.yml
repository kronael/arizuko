# discd — Discord adapter. DISCORD_TOKEN (`Bot <token>` = bot, bare = user
# account) arrives via env/discd.env.
# The outbound dedup record is discd's own prefix on the store server, so discd
# mounts no part of the data dir. Losing that record lets routd's re-send of a
# still-pending row post a second Discord message.
services:
  discd:
    container_name: ${APP}_discd_${FLAVOR}
    image: arizuko:latest
    entrypoint: ['discd']
    env_file: ['../env/discd.env']
    environment:
      ROUTER_URL: 'http://routd:8080'
      LISTEN_ADDR: ':8080'
      LISTEN_URL: 'http://discd:8080'
    depends_on: [routd]
    restart: on-failure
