# slakd — Slack adapter. Bot token + signing secret arrive via env/slakd.env.
# Webhook route: slakd-routes.json (proxyd forwards /slack/ verbatim).
# store/slakd/ only: slakd reads pane_sessions on the store server and writes
# panes back over routd HTTP. The directory carries eyes.json, the watched-message
# state; it needs no other part of the data dir (spec 5/16 step 7).
services:
  slakd:
    container_name: ${APP}_slakd_${FLAVOR}
    image: arizuko:latest
    entrypoint: ['slakd']
    volumes:
      - '${DATA_DIR}/store/slakd:/srv/app/home/store/slakd'
    env_file: ['../env/slakd.env']
    environment:
      ROUTER_URL: 'http://routd:8080'
      SLAKD_USERS_CACHE_TTL: '${SLAKD_USERS_CACHE_TTL:-900}'
      LISTEN_ADDR: ':8080'
      LISTEN_URL: 'http://slakd:8080'
      DATA_DIR: '/srv/app/home/store/slakd'
    depends_on: [routd]
    restart: on-failure
