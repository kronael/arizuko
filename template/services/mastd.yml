# mastd — Mastodon adapter. MASTODON_ACCESS_TOKEN arrives via env/mastd.env;
# mastd reads MASTODON_INSTANCE_URL, which is not scoped.
services:
  mastd:
    container_name: ${APP}_mastd_${FLAVOR}
    image: arizuko:latest
    entrypoint: ['mastd']
    env_file: ['../env/mastd.env']
    environment:
      ROUTER_URL: 'http://routd:8080'
      MASTODON_INSTANCE_URL: '${MASTODON_INSTANCE_URL}'
      LISTEN_ADDR: ':8080'
      LISTEN_URL: 'http://mastd:8080'
    depends_on: [routd]
    restart: on-failure
