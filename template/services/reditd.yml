# reditd — Reddit adapter. API credentials arrive via env/reditd.env;
# REDDIT_SUBREDDITS (the watch list) is instance config.
services:
  reditd:
    container_name: ${APP}_reditd_${FLAVOR}
    image: arizuko:latest
    entrypoint: ['reditd']
    env_file: ['../env/reditd.env']
    environment:
      ROUTER_URL: 'http://routd:8080'
      REDDIT_SUBREDDITS: '${REDDIT_SUBREDDITS}'
      LISTEN_ADDR: ':8080'
      LISTEN_URL: 'http://reditd:8080'
    depends_on: [routd]
    restart: on-failure
