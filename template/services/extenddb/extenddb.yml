# extenddb — the store server (spec 6/42). Every daemon's owner tables live
# here, reached with the DynamoDB protocol over TLS at https://extenddb:18443;
# no daemon opens a file. Third-party images, so their env is exactly what is
# named below — never the shared .env, which carries SECRETS_KEY, AUTH_SECRET
# and every bot token.
#
# The operator runs `extenddb init` once, by hand, against this PostgreSQL
# (INSTALL.md § The store server): it creates both databases, generates the
# self-signed certificate whose SAN is this service name, mints the account,
# and hands each daemon its own access key. The server refuses to start
# without TLS, so the certificate is not optional and every daemon carries it
# as STORE_CA. An instance moves once and a printed-once password has to
# reach .env, so that run belongs to a person, not to a subcommand.
#
# extenddb_db is arizuko's OWN state, not a vendor's bookkeeping, so its data
# directory sits under the instance directory where backup and restore own it —
# unlike litellm_db, whose named volume belongs to the gateway.
#
# Both services run as uid 1000, the uid every arizuko daemon runs as and the
# owner `generate` gives everything under store/. The images' own uids (10001
# for the server, 999 for PostgreSQL) would each need their own owner on a
# mount inside that tree, and one of them would lose it on the next generate.
services:
  extenddb:
    container_name: ${APP}_extenddb_${FLAVOR}
    image: ghcr.io/extenddb/extenddb-postgres:0.1.11
    user: '1000:1000'
    volumes:
      - '${DATA_DIR}/store/extenddb:/var/lib/extenddb'
    ports:
      # Loopback only, for the operator on the host: `arizuko` reaches the same
      # server its daemons do, and the certificate init generates carries
      # 127.0.0.1 beside the service name.
      #
      # STORE_HOST_PORT is the host half, so a second instance on this host
      # takes its own port from .env instead of an edit here — an edited
      # fragment is frozen from the catalog and never takes another store
      # change (BUGS L311). It defaults to the container port, which is what a
      # single instance wants.
      - '127.0.0.1:${STORE_HOST_PORT:-18443}:18443'
    healthcheck:
      test:
        [
          'CMD',
          'extenddb',
          'healthcheck',
          '--config',
          '/var/lib/extenddb/extenddb.toml',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      extenddb_db:
        condition: service_healthy
    restart: on-failure
  extenddb_db:
    container_name: ${APP}_extenddb_db_${FLAVOR}
    image: postgres:17-alpine
    user: '1000:1000'
    # A 32 MB buffer pool, not the default 128 MB: the store is a few hundred
    # MB (289 MB krons, 410 MB sloth, 2026-10-22) and the kernel page cache
    # serves the rest, on a host whose memory the turn guests need.
    command: ['postgres', '-c', 'shared_buffers=32MB']
    environment:
      # The instance owns the role, so the role IS the instance: arizuko_krons
      # administers arizuko_krons's databases and nobody else's.
      POSTGRES_USER: '${APP}_${FLAVOR}'
      POSTGRES_DB: 'postgres'
      POSTGRES_PASSWORD: '${STORE_DB_PASSWORD:?STORE_DB_PASSWORD is unset in .env — without it the store server has nowhere to keep a single row}'
      TZ: '${TZ:-UTC}'
    volumes:
      - '${DATA_DIR}/store/extenddb_db:/var/lib/postgresql/data'
    healthcheck:
      # -d names the database: libpq would otherwise probe one named after the
      # role, which nothing creates, and the server logs a FATAL every probe.
      test: ['CMD-SHELL', 'pg_isready -U ${APP}_${FLAVOR} -d postgres']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: on-failure
