# company-brain product eval — run by arizuko's own harness:
#
#   anteval run --env FILE --sink URL \
#     --product <checkout>/packages/company-brain --cases <checkout>/packages/company-brain/eval

[[case]]
id = "company-brain-replies"
dimension = "product-company-brain"
smoke = true
prompt = "Ref {nonce}. Are you there? Reply with the ref and nothing else."
max_wall_ms = 120000
[case.check]
kind = "rest_reply"
text = "{nonce}"
