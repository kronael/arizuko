{{- if .Values.onbod.enabled }}
{{/*
onbod — onboarding / admission queue, behind proxyd at /onboard. SetupGroup
creates groups/<folder> and its web/pub + web/priv slots, so it mounts those two
directories of the data volume and nothing else of it. ONBOARDING_ENABLED is
forced true: the toggle that decides whether onbod runs is onbod.enabled.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arizuko.fullname" . }}-onbod
  labels:
    {{- include "arizuko.labels" . | nindent 4 }}
    app.kubernetes.io/component: onbod
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "arizuko.selectorLabels" (dict "ctx" . "daemon" "onbod") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "arizuko.selectorLabels" (dict "ctx" . "daemon" "onbod") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "arizuko.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.nodeName }}
      nodeName: {{ .Values.nodeName }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: onbod
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["onbod"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "arizuko.configMapName" . }}
            - secretRef:
                name: {{ include "arizuko.daemonSecretName" (dict "ctx" . "daemon" "onbod") }}
          env:
            - name: AUTHD_SERVICE_NAME
              value: onbod
            - name: ONBOARDING_ENABLED
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /srv/app/home/groups
              subPath: groups
            - name: data
              mountPath: /srv/app/home/web
              subPath: web
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "arizuko.pvcName" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "arizuko.fullname" . }}-onbod
  labels:
    {{- include "arizuko.labels" . | nindent 4 }}
    app.kubernetes.io/component: onbod
spec:
  selector:
    {{- include "arizuko.selectorLabels" (dict "ctx" . "daemon" "onbod") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- if not .Values.secrets.external }}
---
{{ include "arizuko.daemonSecret" (dict "ctx" . "daemon" "onbod" "store" true "keys" dict) }}
{{- end }}
{{- end }}
