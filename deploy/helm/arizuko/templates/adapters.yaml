{{/*
Channel adapters — one Deployment + Service + Secret per enabled entry in
.Values.adapters, mirroring template/services/<name>.yml: the arizuko image,
entrypoint [<name>], ROUTER_URL at routd (ConfigMap), LISTEN_URL at the
adapter's own Service (routd calls it back there), AUTHD_SERVICE_NAME so it
exchanges its key as service:<name>. `env` entries are literal; `secretEnv`
names Secret keys to inject as env vars of the same name, each from the
secrets.* value $tokens maps it to.

WhatsApp (whapd) and gitd run other images or need an auth
volume in compose and are not in the default list.
*/}}
{{- $ctx := . -}}
{{- $full := include "arizuko.fullname" . -}}
{{- $configMap := include "arizuko.configMapName" . -}}
{{- $tokens := dict
    "TELEGRAM_BOT_TOKEN"     "telegramBotToken"
    "DISCORD_BOT_TOKEN"      "discordBotToken"
    "SLACK_BOT_TOKEN"        "slackBotToken"
    "SLACK_SIGNING_SECRET"   "slackSigningSecret"
    "EMAIL_IMAP_HOST"        "emailImapHost"
    "EMAIL_SMTP_HOST"        "emailSmtpHost"
    "EMAIL_ACCOUNT"          "emailAccount"
    "EMAIL_PASSWORD"         "emailPassword"
-}}
{{- range .Values.adapters }}
{{- if .enabled }}
{{- $name := .name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-{{ $name }}
  labels:
    {{- include "arizuko.labels" $ctx | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "arizuko.selectorLabels" (dict "ctx" $ctx "daemon" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "arizuko.selectorLabels" (dict "ctx" $ctx "daemon" $name) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "arizuko.serviceAccountName" $ctx }}
      {{- with $ctx.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: {{ $name }}
          image: "{{ $ctx.Values.image.repository }}:{{ $ctx.Values.image.tag }}"
          imagePullPolicy: {{ $ctx.Values.image.pullPolicy }}
          command: {{ toJson .entrypoint }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ $configMap }}
            - secretRef:
                name: {{ include "arizuko.daemonSecretName" (dict "ctx" $ctx "daemon" $name) }}
          env:
            - name: AUTHD_SERVICE_NAME
              value: {{ $name }}
            - name: LISTEN_ADDR
              value: ":8080"
            - name: LISTEN_URL
              value: {{ include "arizuko.daemonURL" (dict "ctx" $ctx "daemon" $name) | quote }}
            {{- range $k, $v := .env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          {{- with $ctx.Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-{{ $name }}
  labels:
    {{- include "arizuko.labels" $ctx | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  selector:
    {{- include "arizuko.selectorLabels" (dict "ctx" $ctx "daemon" $name) | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- if not $ctx.Values.secrets.external }}
---
{{- $keys := dict }}
{{- range $key := .secretEnv }}
{{- $vkey := index $tokens $key }}
{{- if not $vkey }}
{{- fail (printf "adapters[%s].secretEnv names %s, which no secrets.* value carries (templates/adapters.yaml $tokens)" $name $key) }}
{{- end }}
{{- $_ := set $keys $key (required (printf "secrets.%s must be set: adapters[%s].secretEnv lists %s" $vkey $name $key) (index $ctx.Values.secrets $vkey)) }}
{{- end }}
{{ include "arizuko.daemonSecret" (dict "ctx" $ctx "daemon" $name "store" true "keys" $keys) }}
{{- end }}
{{- end }}
{{- end }}
