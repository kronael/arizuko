{{- if .Values.timed.enabled }}
{{/*
timed — the scheduler. No volume and no store key: it federates its fire loop
over routd's HTTP face with a service:timed token. One replica, Recreate: two
would fire every schedule twice. timed reads TIMEZONE where the rest read TZ.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arizuko.fullname" . }}-timed
  labels:
    {{- include "arizuko.labels" . | nindent 4 }}
    app.kubernetes.io/component: timed
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "arizuko.selectorLabels" (dict "ctx" . "daemon" "timed") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "arizuko.selectorLabels" (dict "ctx" . "daemon" "timed") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "arizuko.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: timed
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["timed"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "arizuko.configMapName" . }}
            - secretRef:
                name: {{ include "arizuko.daemonSecretName" (dict "ctx" . "daemon" "timed") }}
          env:
            - name: AUTHD_SERVICE_NAME
              value: timed
            - name: TIMEZONE
              value: {{ .Values.config.tz | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- if not .Values.secrets.external }}
---
{{ include "arizuko.daemonSecret" (dict "ctx" . "daemon" "timed" "store" false "keys" dict) }}
{{- end }}
{{- end }}
