{{- if and .Values.web.enabled .Values.web.proxyd.enabled }}
{{/*
proxyd — the public reverse proxy + auth gate; the Ingress points here. No
volume: its route table is the proxyd_routes rows on the store, read live per
request, and the chart writes none (README § proxyd routes). AUTH_SECRET is
its auth-enabled flag.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arizuko.fullname" . }}-proxyd
  labels:
    {{- include "arizuko.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxyd
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "arizuko.selectorLabels" (dict "ctx" . "daemon" "proxyd") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "arizuko.selectorLabels" (dict "ctx" . "daemon" "proxyd") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "arizuko.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: proxyd
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["proxyd"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "arizuko.configMapName" . }}
            - secretRef:
                name: {{ include "arizuko.daemonSecretName" (dict "ctx" . "daemon" "proxyd") }}
          env:
            - name: AUTHD_SERVICE_NAME
              value: proxyd
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "arizuko.fullname" . }}-proxyd
  labels:
    {{- include "arizuko.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxyd
spec:
  selector:
    {{- include "arizuko.selectorLabels" (dict "ctx" . "daemon" "proxyd") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- if not .Values.secrets.external }}
---
{{- $keys := dict "AUTH_SECRET" (required "secrets.authSecret must be set: AUTH_SECRET signs the web session cookies and the OAuth state (openssl rand -hex 32)" .Values.secrets.authSecret) }}
{{ include "arizuko.daemonSecret" (dict "ctx" . "daemon" "proxyd" "store" true "keys" $keys) }}
{{- end }}
{{- end }}
