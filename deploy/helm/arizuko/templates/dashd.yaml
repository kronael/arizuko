{{- if .Values.dashd.enabled }}
{{/*
dashd — the operator console, behind proxyd at /dash/. It reads and writes group
files, so it mounts groups/ and surrogate/ from the data volume and nothing
else of it. SECRETS_KEY because it writes user secrets with the key routd reads
with; AUTH_SECRET keys its Connect-GitHub state.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arizuko.fullname" . }}-dashd
  labels:
    {{- include "arizuko.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "arizuko.selectorLabels" (dict "ctx" . "daemon" "dashd") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "arizuko.selectorLabels" (dict "ctx" . "daemon" "dashd") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "arizuko.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.nodeName }}
      nodeName: {{ .Values.nodeName }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: dashd
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["dashd"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "arizuko.configMapName" . }}
            - secretRef:
                name: {{ include "arizuko.daemonSecretName" (dict "ctx" . "daemon" "dashd") }}
          env:
            - name: AUTHD_SERVICE_NAME
              value: dashd
            - name: DASH_PORT
              value: "8080"
          volumeMounts:
            - name: data
              mountPath: /srv/app/home/groups
              subPath: groups
            - name: data
              mountPath: /srv/app/home/surrogate
              subPath: surrogate
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "arizuko.pvcName" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "arizuko.fullname" . }}-dashd
  labels:
    {{- include "arizuko.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashd
spec:
  selector:
    {{- include "arizuko.selectorLabels" (dict "ctx" . "daemon" "dashd") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- if not .Values.secrets.external }}
---
{{- $keys := dict
    "AUTH_SECRET" (required "secrets.authSecret must be set: AUTH_SECRET signs the web session cookies and the OAuth state (openssl rand -hex 32)" .Values.secrets.authSecret)
    "SECRETS_KEY" (required "secrets.secretsKey must be set: SECRETS_KEY seals the secrets table routd owns, and dashd writes user secrets with the same key (openssl rand -hex 32)" .Values.secrets.secretsKey)
}}
{{ include "arizuko.daemonSecret" (dict "ctx" . "daemon" "dashd" "store" true "keys" $keys) }}
{{- end }}
{{- end }}
