{{- if and .Values.web.enabled .Values.web.webd.enabled }}
{{/*
webd — chat widget, operator panel, /api, /me portal. Registers as a channel at
routd (ROUTER_URL) and is called back at WEBD_URL. No volume: it reads routd's
tables on the store and serves the widget from the binary. One replica: its SSE
hub is in-process, and routd posts each reply to one webd.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arizuko.fullname" . }}-webd
  labels:
    {{- include "arizuko.labels" . | nindent 4 }}
    app.kubernetes.io/component: webd
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "arizuko.selectorLabels" (dict "ctx" . "daemon" "webd") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "arizuko.selectorLabels" (dict "ctx" . "daemon" "webd") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "arizuko.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: webd
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["webd"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "arizuko.configMapName" . }}
            - secretRef:
                name: {{ include "arizuko.daemonSecretName" (dict "ctx" . "daemon" "webd") }}
          env:
            - name: AUTHD_SERVICE_NAME
              value: webd
            - name: WEBD_URL
              value: {{ include "arizuko.daemonURL" (dict "ctx" . "daemon" "webd") | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "arizuko.fullname" . }}-webd
  labels:
    {{- include "arizuko.labels" . | nindent 4 }}
    app.kubernetes.io/component: webd
spec:
  selector:
    {{- include "arizuko.selectorLabels" (dict "ctx" . "daemon" "webd") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- if not .Values.secrets.external }}
---
{{ include "arizuko.daemonSecret" (dict "ctx" . "daemon" "webd" "store" true "keys" dict) }}
{{- end }}
{{- end }}
