{{/*
The data volume: groups/, web/, ipc/, app-src/, images/ and vms/ — the files
routd reads and runed mounts into each guest. No rows live here; those are on
the store server. RWO and one node, because the per-turn Unix socket under
ipc/ is an inode routd and runed must both see.
*/}}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "arizuko.pvcName" . }}
  labels:
    {{- include "arizuko.labels" . | nindent 4 }}
  {{- with .Values.persistence.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
{{- end }}
