apiVersion: v2
name: arizuko
description: |
  Multitenant Claude agent router on Kubernetes: authd, routd and runed, the
  web plane (proxyd/webd/vited), the operator daemons (dashd/onbod/timed/davd)
  and a values-driven set of channel adapters — one Deployment + Service +
  Secret each, mirroring compose/compose.go. The store is a DynamoDB-protocol
  server you run (DYNAMODB_URL); the data volume holds the group folders; runed
  boots one KVM guest per turn and needs a node with /dev/kvm.
type: application
# Chart version — bump on chart template changes.
version: 0.2.0

# Tracks the arizuko app release this chart was written against.
appVersion: '0.70.2'

keywords:
  - arizuko
  - claude
  - agent
  - chatops
home: https://github.com/kronael/arizuko
sources:
