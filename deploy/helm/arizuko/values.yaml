# Default values for the arizuko chart: the topology compose/compose.go
# generates, on Kubernetes. Read README.md before installing — the store is a
# server you run, the data volume pins to one node, and runed needs a KVM node.

# ---------------------------------------------------------------------------
# Images, built by `make images`:
#   - arizuko       every daemon and Go adapter, one entrypoint each
#   - arizuko-vite  vited, the /pub + /priv static tree
#   - arizuko-davd  davd, WebDAV over groups/ (optional)
# The agent image (arizuko-ant) is a BUILD input, not a runtime setting:
# `make rootfs` exports its filesystem into runed.rootfsDir and runed boots
# that tree (spec 6/41).
# ---------------------------------------------------------------------------
image:
  repository: arizuko
  tag: latest
  pullPolicy: IfNotPresent
viteImage: arizuko-vite:latest
davImage: arizuko-davd:latest
imagePullSecrets: []

nameOverride: ''
fullnameOverride: ''

# Every pod that mounts the data volume (routd, runed, onbod, dashd, davd,
# vited) lands on ONE node: the claim is RWO, and routd and runed must see the
# same Unix socket inode. Name that node here — it is the node runed.nodeSelector
# picks.
nodeName: ''
nodeSelector: {}
tolerations: []

serviceAccount:
  create: true
  name: ''
  annotations: {}

# ---------------------------------------------------------------------------
# The store. Every daemon's owner tables live on one DynamoDB-protocol server;
# no daemon opens a file. The chart runs no store: point url at the extenddb
# pair from template/services/extenddb.yml, a PostgreSQL you run, or Amazon
# DynamoDB. `extenddb init` (INSTALL.md § The store server) is a one-time run
# by hand; it mints the per-daemon access keys under secrets.daemons.
# ---------------------------------------------------------------------------
store:
  url: '' # DYNAMODB_URL (required), e.g. https://extenddb.store.svc:18443
  region: us-east-1 # AWS_REGION — the signing region
  # STORE_CA — the endpoint certificate, base64 (`base64 -w0 cert.pem`).
  # extenddb refuses to serve without TLS and its certificate is self-signed;
  # leave empty for an endpoint whose certificate the system trusts.
  ca: ''

# ---------------------------------------------------------------------------
# The data volume: groups/ (the agent homes routd reads and runed mounts),
# web/, ipc/ (one per-turn Unix socket per folder — routd binds it, runed's
# bridge dials it), app-src/, images/ (kernel + rootfs) and vms/. No rows live
# on it. Mounted at /srv/app/home (compose's containerDataMount). Seed it once
# with `arizuko create` before the first start.
# ---------------------------------------------------------------------------
persistence:
  enabled: true
  # Leave empty to let the chart create a PVC; set to use an existing claim.
  existingClaim: ''
  storageClass: ''
  accessMode: ReadWriteOnce
  size: 20Gi
  annotations: {}

# ---------------------------------------------------------------------------
# Non-secret config — lands in a ConfigMap every daemon reads.
# ---------------------------------------------------------------------------
config:
  assistantName: arizuko
  instance: arizuko # ARIZUKO_INSTANCE — OTLP service.instance.id
  webHost: '' # WEB_HOST (required) — the public hostname
  tz: UTC
  logLevel: info
  containerTimeout: '600000' # CONTAINER_TIMEOUT (ms)
  idleTimeout: '300000' # IDLE_TIMEOUT (ms)
  maxConcurrentContainers: '3' # MAX_CONCURRENT_CONTAINERS — live guests at once
  otelEndpoint: '' # OTEL_EXPORTER_OTLP_ENDPOINT; empty = stderr-only logging
  onboardingEnabled: false # ONBOARDING_ENABLED
  webdavEnabled: true # WEBDAV_ENABLED (davd)

# ---------------------------------------------------------------------------
# runed — the execution plane. One KVM guest per turn: the pod opens /dev/kvm,
# /dev/vhost-vsock and /dev/net/tun, holds NET_ADMIN + SYS_ADMIN, runs as root
# and AppArmor-unconfined (README § runed needs a KVM node).
# ---------------------------------------------------------------------------
runed:
  # Selects the node that has /dev/kvm; merged over the global nodeSelector.
  nodeSelector: {}
  # The release artifacts a guest boots, by the path runed's container sees.
  # Both required. `make kernel` and `make rootfs` write them under
  # <data dir>/images/, so on the data volume: /srv/app/home/images/<dir>.
  kernelDir: '' # RUNED_KERNEL_DIR — holds bzImage + initrd.gz
  rootfsDir: '' # RUNED_ROOTFS_DIR — the exported arizuko-ant tree

# ---------------------------------------------------------------------------
# Secrets: one Secret per daemon, named <release>-<daemon>, holding exactly the
# keys compose scopes into that daemon's env file (compose.go daemonKeys). An
# enabled daemon with a missing value fails the render, naming the value.
# ---------------------------------------------------------------------------
secrets:
  # true: the chart renders no Secret. Create <release>-<daemon> yourself
  # (External Secrets, sealed-secrets, …) with the keys README § Secrets lists.
  external: false

  # Generate both with: openssl rand -hex 32
  authSecret: '' # AUTH_SECRET — session cookies and OAuth state (authd, proxyd, dashd)
  secretsKey: '' # SECRETS_KEY — seals the secrets table (routd, dashd)

  # The model credential runed hands to every turn. Set one of the two.
  claudeCodeOauthToken: '' # CLAUDE_CODE_OAUTH_TOKEN
  anthropicApiKey: '' # ANTHROPIC_API_KEY

  # Per daemon. serviceKey is its AUTHD_SERVICE_KEY (openssl rand -hex 32;
  # authd learns the whole set from these same values). storeKeyId and
  # storeSecret are its own AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY from
  # `extenddb init`. timed holds no store key: it writes through routd's HTTP
  # API. Add an entry for every adapter you enable.
  daemons:
    authd:
      storeKeyId: ''
      storeSecret: ''
    routd:
      serviceKey: ''
      storeKeyId: ''
      storeSecret: ''
    runed:
      serviceKey: ''
      storeKeyId: ''
      storeSecret: ''
    timed:
      serviceKey: ''
    onbod:
      serviceKey: ''
      storeKeyId: ''
      storeSecret: ''
    dashd:
      serviceKey: ''
      storeKeyId: ''
      storeSecret: ''
    webd:
      serviceKey: ''
      storeKeyId: ''
      storeSecret: ''
    proxyd:
      serviceKey: ''
      storeKeyId: ''
      storeSecret: ''
    teled:
      serviceKey: ''
      storeKeyId: ''
      storeSecret: ''
    discd:
      serviceKey: ''
      storeKeyId: ''
      storeSecret: ''
    slakd:
      serviceKey: ''
      storeKeyId: ''
      storeSecret: ''
    emaid:
      serviceKey: ''
      storeKeyId: ''
      storeSecret: ''

  # Platform tokens. adapters[].secretEnv names which ones reach which adapter;
  # a listed key with no value here fails the render.
  telegramBotToken: '' # TELEGRAM_BOT_TOKEN     (teled)
  discordBotToken: '' # DISCORD_BOT_TOKEN      (discd)
  slackBotToken: '' # SLACK_BOT_TOKEN        (slakd)
  slackSigningSecret: '' # SLACK_SIGNING_SECRET   (slakd)
  emailImapHost: '' # EMAIL_IMAP_HOST        (emaid)
  emailSmtpHost: '' # EMAIL_SMTP_HOST        (emaid)
  emailAccount: '' # EMAIL_ACCOUNT          (emaid)
  emailPassword: '' # EMAIL_PASSWORD         (emaid)

# ---------------------------------------------------------------------------
# Web plane. proxyd is the public entry; webd + vited sit behind it. Every
# daemon listens on :8080 inside its container.
# ---------------------------------------------------------------------------
web:
  enabled: true
  proxyd:
    enabled: true # public reverse proxy + auth gate; the Ingress points here
  webd:
    enabled: true # chat widget, panel, /api, /me portal
  vited:
    enabled: true # static /pub + /priv tree

ingress:
  enabled: false
  className: ''
  annotations: {}
  # host defaults to config.webHost when empty.
  host: ''
  tls: []
  #  - secretName: arizuko-tls
  #    hosts:
  #      - arizuko.example.com

# Optional core daemons (compose profiles). authd, routd and runed always run.
timed:
  enabled: true # scheduled messages
dashd:
  enabled: true # operator dashboard (/dash)
onbod:
  enabled: false # onboarding / admission queue
davd:
  enabled: false # WebDAV over groups/ (needs config.webdavEnabled too)

# ---------------------------------------------------------------------------
# Channel adapters. The chart ranges over this list and renders one
# Deployment + Service + Secret per enabled entry, mirroring
# template/services/<name>.yml: image arizuko, entrypoint [<name>], ROUTER_URL
# at routd, LISTEN_URL at its own Service, its service key under
# secrets.daemons.<name>. `env` values are literal; `secretEnv` lists Secret
# keys to inject as env vars of the same name, from secrets.* above.
# ---------------------------------------------------------------------------
adapters:
  - name: teled
    enabled: false
    entrypoint: ['teled']
    secretEnv:
      - TELEGRAM_BOT_TOKEN

  - name: discd
    enabled: false
    entrypoint: ['discd']
    secretEnv:
      - DISCORD_BOT_TOKEN

  - name: slakd
    enabled: false
    entrypoint: ['slakd']
    env:
      SLAKD_USERS_CACHE_TTL: '900'
    secretEnv:
      - SLACK_BOT_TOKEN
      - SLACK_SIGNING_SECRET

  - name: emaid
    enabled: false
    entrypoint: ['emaid']
    secretEnv:
      - EMAIL_IMAP_HOST
      - EMAIL_SMTP_HOST
      - EMAIL_ACCOUNT
      - EMAIL_PASSWORD

# Resource requests/limits applied to each daemon pod (override per-need).
resources: {}
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
  # limits:
  #   cpu: "1"
  #   memory: 512Mi
