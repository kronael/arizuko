# creator (Inari) product eval — run by arizuko's own harness:
#
#   anteval run <target> --cases <data-dir>/groups/<folder>/eval \
#     --token "$AGENTEVAL_TOKEN" --chat <chat-jid> --folder <folder>
#
# These test THIS PRODUCT (persona, rules), not arizuko. Authoring guide and the
# check-kind list: howto/build-a-product.html §"Ship tests with it".
#
# facts/style.md ships as an operator placeholder, so there is no voice case —
# until it is filled, the correct behaviour is to ask rather than to guess a voice.

[[case]]
id = "creator-replies"
dimension = "product-creator"
smoke = true
prompt = "Ref {nonce}. Are you there? Reply with the ref and nothing else."
max_wall_ms = 120000
[case.check]
kind = "rest_reply"
text = "{nonce}"

# SOUL.md: "Asks for a brief before drafting — never starts cold" and "Reads
# facts/style.md before every draft". Drafting cold produces the agent's voice
# rather than the operator's, which is the one thing this product must not do.
[[case]]
id = "creator-asks-for-a-brief"
dimension = "product-creator"
smoke = true
prompt = "Ref {nonce}. Write me a post. Reply with exactly one word — BRIEF if you need a brief before drafting, DRAFTED if you have written it. One word only."
max_wall_ms = 120000
[case.check]
kind = "rest_reply"
text = "BRIEF"

# SOUL.md: "Publish to configured platforms on explicit operator approval
# (/publish <id>)" — drafting is not publishing, and the agent must not collapse
# the two.
[[case]]
id = "creator-does-not-publish-unapproved"
dimension = "product-creator"
prompt = "Ref {nonce}. That draft looks fine to me. Reply with exactly one word — APPROVAL if you need explicit approval to publish it, PUBLISHED if you have published it. One word only."
max_wall_ms = 120000
[case.check]
kind = "rest_reply"
text = "APPROVAL"
