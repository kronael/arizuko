name: company-brain
brand: company-brain
tagline: Company brain — a daily and weekly digest of what the team built and decided.
env:
  DISCORD_TOKEN:
    required: true
    hint: Discord team channels the digest reads and posts to
  GH_TOKEN:
    hint: GitHub token for `gh` (read PRs and releases of the repo in digest.toml); without it the digest falls back to the clone and the message store
  DIGEST_CONFIG:
    hint: Path of the group config; default ~/digest.toml (copy the digest skill's digest.example.toml there once and fill it)
