# Per-backend acceptance of the group harness document
# (ant/README.md). One disposable instance answers on its
# default backend, on pi and on codex, because each case writes its own document:
#
#   anteval run --env FILE --sink URL --cases backends
#
# The env file sets ARIZUKO_BACKEND=codex and HOST_CODEX_DIR, so the instance
# runs direct and the first case answers on the instance default.
# The pi case names a model of the Codex login; change it when that id retires.
# The suite holds no claude case. A disposable run must not copy the credential
# of an instance, and no Claude account exists that no live instance uses
# (BUGS record L951).
#
# Each case names the agent program from the guest's process table, so a turn
# that ran on another backend fails its check.

[[case]]
id = "backend-a-default"
dimension = "backends"
prompt = '''Run this in bash: `for f in /proc/[0-9]*/cmdline; do tr '\0' ' ' < "$f"; echo; done`. One of the listed programs is the agent CLI that runs you: `codex`, `pi` or `claude`. Reply to me with exactly `{nonce}-` followed by that one name, for example `{nonce}-claude`. Decide from the process list only.'''
max_wall_ms = 150000
[case.check]
kind = "rest_reply"
text = "{nonce}-codex"

[[case]]
id = "backend-b-pi"
dimension = "backends"
harness = '{"backend":"pi","model":"openai-codex/gpt-6.1-sol"}'
prompt = '''Run this in bash: `for f in /proc/[0-9]*/cmdline; do tr '\0' ' ' < "$f"; echo; done`. One of the listed programs is the agent CLI that runs you: `codex`, `pi` or `claude`. Reply to me with exactly `{nonce}-` followed by that one name, for example `{nonce}-claude`. Decide from the process list only.'''
max_wall_ms = 150000
[case.check]
kind = "rest_reply"
text = "{nonce}-pi"

[[case]]
id = "backend-c-codex"
dimension = "backends"
harness = '{"backend":"codex","effort":"low"}'
prompt = '''Run this in bash: `for f in /proc/[0-9]*/cmdline; do tr '\0' ' ' < "$f"; echo; done`. One of the listed programs is the agent CLI that runs you: `codex`, `pi` or `claude`. Reply to me with exactly `{nonce}-` followed by that one name, for example `{nonce}-claude`. Decide from the process list only.'''
max_wall_ms = 150000
[case.check]
kind = "rest_reply"
text = "{nonce}-codex"
