[[connector]]
name      = "namecheap"
transport = "rest"
url       = "https://api.namecheap.com"
secrets   = ["NAMECHEAP_KEY"]
query     = { ApiKey = "{secret:NAMECHEAP_KEY}" }

  [[connector.tool]]
  name        = "dns_list"
  description = "List DNS hosts for a Namecheap domain. Requires ApiUser and ClientIp params."
  scope       = "ext:namecheap:dns:read"
  method      = "GET"
  path        = "/xml.response"
